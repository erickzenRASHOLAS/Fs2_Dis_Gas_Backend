# Perfil de PRODUCCION (AWS). Se activa con la variable SPRING_PROFILES_ACTIVE=prod
# Ningun dato sensible va en este archivo: todoo viene de variables de entorno (/etc/app.env en EC2).

# Base de datos MySQL en RDS
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Clave JWT: sin valor por defecto, si falta la variable la app no arranca
jwt.secret=${JWT_SECRET}

# Origen exacto del frontend (ej: http://mi-bucket.s3-website-us-east-1.amazonaws.com) SIN barra final
app.cors.allowed-origin=${CORS_ORIGIN}

# Para la demo: DEMO_USERS=false desactiva los usuarios de prueba
app.seed.demo-users=${DEMO_USERS:true}
