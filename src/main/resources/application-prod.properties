# Perfil de PRODUCCION: se usa en Docker y en AWS. Se activa con SPRING_PROFILES_ACTIVE=prod
# Aqui no hay datos sensibles: toodo viene de variables de entorno (docker-compose.yml o /etc/app.env).

# Base de datos MySQL (en Docker: el contenedor "db"; en AWS: el endpoint de RDS)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Clave JWT: sin valor por defecto. Si falta la variable, la app no arranca (es lo correcto)
jwt.secret=${JWT_SECRET}

# Origen exacto del frontend, SIN barra final (ej: http://localhost:3000)
app.cors.allowed-origin=${CORS_ORIGIN}

# DEMO_USERS=false desactiva los usuarios de prueba
app.seed.demo-users=${DEMO_USERS:true}
