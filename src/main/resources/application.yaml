spring:
  application:
    name: DisGasBackend
  datasource:
    # Por defecto usa H2 en memoria (modo MySQL) para desarrollo.
    # En producción (AWS RDS) se sobreescribe con DB_URL, DB_USERNAME y DB_PASSWORD.
    url: ${DB_URL:jdbc:h2:mem:disgas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate no lo modifica.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match: /v1/**

app:
  jwt:
    # Mínimo 32 caracteres. En producción SIEMPRE definir JWT_SECRET (ver application-prod.yaml).
    secret: ${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-0123456789}
    issuer: disgas-backend
    access-expiration-minutes: 30
    refresh-expiration-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    demo-users: ${SEED_DEMO_USERS:true}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
