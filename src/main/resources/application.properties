spring.application.name=DisGasBackend
server.port=8080

# ---------- Base de datos (DESARROLLO) ----------
# Sin Docker ni MySQL: H2 en memoria. Se borra al apagar la app.
# Con Docker/AWS se activa el perfil "prod" (application-prod.properties) y se usa MySQL.
spring.datasource.url=jdbc:h2:mem:disgas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades (@Entity del paquete model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Clave para firmar los tokens (minimo 32 caracteres). En Docker/AWS viene de la variable JWT_SECRET.
jwt.secret=clave-solo-para-desarrollo-no-usar-en-produccion-123456
jwt.expiracion-minutos=60
jwt.refresh-dias=7

# ---------- CORS ----------
# Origen(es) del frontend permitidos. Si son varios, separarlos con coma (sin espacios ni barra final).
app.cors.allowed-origin=http://localhost:5173

# ---------- Datos de demostracion ----------
# true = crea usuarios de prueba (admin, vendedor, clientes) si la tabla esta vacia
app.seed.demo-users=true

# ---------- Swagger y salud ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/v1/**
# /actuator/health responde {"status":"UP"} cuando la app y la base de datos funcionan
management.endpoints.web.exposure.include=health
